<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;700&display=swap">
<style>
  .dp *, .dp-dialog * { box-sizing: border-box; }
  .dp { --acc:#ee5600; --acc-dark:#d94e00; --acc-shadow:rgba(234,44,0,.35); --muted:#eeeeee; --sec:#6f6f6f; --ter:#555555; --border:#e2e2e2; --r-sm:8px; --r-md:14px; --r-lg:24px; --shadow:0 4px 18px rgba(0,0,0,.06);
    font-family:"Comfortaa","Segoe UI",Arial,sans-serif; color:#000; background:#fff; line-height:1.5; }
  .dp a { color:inherit; text-decoration:none; }
  .dp h1,.dp h2,.dp h3 { font-weight:700; letter-spacing:-0.01em; }
  .dp h1 { font-size:34px; margin:0 0 16px; }
  .dp-container { width:100%; margin:0 auto; padding:0 40px; }

  /* --- Шапка --- */
  .dp-header { position:sticky; top:0; z-index:1000; background:rgba(255,255,255,.72); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); box-shadow:0 8px 30px -12px rgba(0,0,0,.15); border-radius:0 0 30px 30px; padding:16px 0; }
  .dp-header__inner { display:flex; align-items:center; gap:16px; }
  .dp-logo { flex:0 0 auto; display:flex; }
  .dp-logo img { width:46px; height:46px; border-radius:50%; }
  .dp-search { display:flex; align-items:center; flex:1 1 auto; min-width:0; background:var(--muted); border-radius:10px; overflow:hidden; }
  .dp-search input { flex:1 1 auto; min-width:0; border:none; background:transparent; padding:12px 0 12px 16px; font-family:inherit; font-size:15px; color:#000; }
  .dp-search input:focus { outline:none; }
  .dp-search button { flex:0 0 auto; display:flex; align-items:center; justify-content:center; width:44px; height:44px; border:none; background:transparent; color:var(--sec); cursor:pointer; }
  .dp-search button:hover { color:var(--acc); }
  .dp-search-toggle { display:none; align-items:center; justify-content:center; width:40px; height:40px; border:none; background:transparent; color:#000; cursor:pointer; flex:0 0 auto; padding:0; }
  .dp-catbtn { display:inline-flex; align-items:center; flex:0 0 auto; border:2px solid var(--acc); border-radius:999px; padding:8px 16px; font-weight:600; font-size:14px; color:var(--acc); white-space:nowrap; }
  .dp-catbtn:hover { background:var(--acc); color:#fff; }
  .dp-cart { display:inline-flex; align-items:center; gap:6px; flex:0 0 auto; background:var(--acc); color:#fff; border-radius:999px; padding:8px 16px; font-weight:600; font-size:14px; box-shadow:0 0 20px var(--acc-shadow); white-space:nowrap; cursor:pointer; }
  .dp-cart:hover { background:var(--acc-dark); color:#fff; }
  .dp-hamburger { display:inline-flex; flex-direction:column; justify-content:center; gap:5px; width:40px; height:40px; border:none; background:transparent; cursor:pointer; padding:0; flex:0 0 auto; }
  .dp-hamburger span { display:block; height:2px; width:22px; background:#000; border-radius:2px; }
  .dp-menu { display:none; flex-direction:column; gap:4px; width:100%; margin:0 auto; padding:0 40px 16px; }
  .dp-menu.is-open { display:flex; }
  .dp-menu a, .dp-menu .dp-linkbtn { padding:10px 0; border-top:1px solid var(--border); font-size:15px; }
  .dp-linkbtn { border:none; background:transparent; padding:0; font:inherit; color:inherit; cursor:pointer; text-align:left; }
  .dp-linkbtn:hover { color:var(--acc); }
  @media (min-width:721px) {
    .dp-hamburger { display:none; }
    .dp-menu { display:flex; flex-direction:row; align-items:center; gap:32px; padding:28px 40px 0; }
    .dp-menu a, .dp-menu .dp-linkbtn { padding:0; border-top:none; font-size:17px; font-weight:600; }
  }

  /* --- Кнопки --- */
  .dp-btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:6px; padding:12px 22px; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; }
  .dp-btn-primary { background:var(--acc); color:#fff; box-shadow:0 0 20px var(--acc-shadow); }
  .dp-btn-primary:hover { background:var(--acc-dark); color:#fff; }
  .dp-btn-secondary { background:var(--muted); color:#000; }
  .dp-btn-secondary:hover { background:#e2e2e2; }

  /* --- Диалог «Доставка и оплата» --- */
  .dp-dialog { border:none; border-radius:14px; box-shadow:0 4px 18px rgba(0,0,0,.06); padding:28px; max-width:420px; width:calc(100% - 40px); font-family:"Comfortaa","Segoe UI",Arial,sans-serif; color:#000; line-height:1.5; position:fixed; }
  .dp-dialog::backdrop { background:rgba(0,0,0,.4); }
  .dp-dialog h3 { margin-top:0; font-weight:700; }
  .dp-dialog__close { position:absolute; top:14px; right:14px; border:none; background:transparent; font-size:20px; line-height:1; cursor:pointer; color:#6f6f6f; }

  /* --- Результаты поиска: карточки один в один с .product-card в Go --- */
  .dp-results { padding:24px 0 32px; }
  .dp-results h1 { font-size:34px; margin:0 0 12px; }
  .dp-results__status { color:var(--sec); margin:0 0 20px; }
  .dp-results__grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:20px; }
  .dp-scard { border:1px solid var(--border); border-radius:var(--r-md); padding:16px; display:flex; flex-direction:column; gap:10px; }
  .dp-scard__imgwrap { display:block; }
  .dp-scard__img { width:100%; height:auto; max-height:320px; display:block; object-fit:contain; border-radius:var(--r-sm); margin:0 auto; }
  .dp-scard__noimg { display:block; height:180px; border-radius:var(--r-sm); background:var(--muted) url(https://raw.githubusercontent.com/DmitryAlekseev1608/dp-catalog-img/main/logo-512.png) center/45% no-repeat; opacity:.45; }
  .dp-scard__name { font-weight:700; font-size:15px; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; min-height:2.6em; }
  .dp-scard__sku { color:var(--sec); font-size:12px; }
  .dp-scard__price { color:var(--acc); font-weight:700; }
  .dp-scard__btn { margin-top:auto; align-self:flex-start; padding:8px 16px; font-size:14px; }
  .dp-results__more { margin-top:24px; }

  /* --- Подвал --- */
  .dp-footer { margin-top:64px; background:var(--acc); padding:32px 0; color:rgba(255,255,255,.85); font-size:17px; }
  .dp-footer a:hover, .dp-footer .dp-linkbtn:hover { color:#fff; }
  .dp-footer__grid { display:grid; grid-template-columns:repeat(3,1fr); gap:32px; overflow-wrap:break-word; }
  .dp-footer__col h4 { color:#fff; font-size:19px; margin:0 0 14px; font-weight:700; }
  .dp-footer__col ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .dp-footer .dp-linkbtn { color:rgba(255,255,255,.85); font-size:17px; }

    .dp-header__inner { flex-wrap:wrap; gap:8px; justify-content:space-between; }
    .dp-logo { order:1; }
    .dp-logo img { width:32px; height:32px; }
    .dp-search-toggle { display:inline-flex; order:2; }
    .dp-search { display:none; order:6; flex:1 1 100%; min-width:0; margin-top:10px; }
    .dp-search.is-open { display:flex; }
    .dp-search input { padding:8px 0 8px 10px; font-size:14px; }
    .dp-search button { width:36px; height:36px; }
    .dp-catbtn { order:3; padding:8px 12px; font-size:13px; }
    .dp-cart { order:4; padding:8px 10px; }
    .dp-cart__label { display:none; }
    .dp-hamburger { order:5; }
    .dp-menu { padding:0 24px 16px; }
    .dp-footer__grid { grid-template-columns:1fr 1fr; }
    .dp-results h1 { font-size:26px; }
  }
  @media (max-width:480px) {
    .dp-footer__grid { grid-template-columns:1fr; }

  /* Страница товара Tilda: шрифт и акценты как в Go-приложении */
  html.dp-tproduct, html.dp-tproduct body, html.dp-tproduct body * {

  /* подвал у страницы товара — без верхнего отступа в 64px, он тут лишний */

</style>

<script>
(function(){

  var PAGE = 24;

  function norm(s){ return (s || '').toLowerCase().replace(/ё/g, 'е'); }
  function esc(s){ return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function money(v){ var n = parseFloat(v); if (!n && n !== 0) return 'Цена по запросу';
    return n.toLocaleString('ru-RU') + ' \u20bd'; }

    var q = ((form.querySelector('input[name=q]') || {}).value || '').trim();
    if (!q) { e.preventDefault(); return; }
    e.preventDefault();
    location.href = '/catalog?q=' + encodeURIComponent(q);
  });

  var qm = location.search.match(/[?&]q=([^&]*)/);
  if (qm && /^\/catalog\/?$/.test(location.pathname)) {
    var q = decodeURIComponent(qm[1].replace(/\+/g, ' ')).trim();
    var box = document.querySelector('.js-dp-search input[name=q]'); if (box) box.value = q;
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ runSearch(q); });
    else runSearch(q);
  }

  function runSearch(q){
    var host = document.querySelector('.t-catalog') || document.querySelector('.js-catalog');
    if (!host) { setTimeout(function(){ runSearch(q); }, 400); return; }
    host.style.display = 'none';                      // прячем обычную выдачу ST300
    var wrap = document.createElement('div');
    wrap.className = 'dp dp-results';
    wrap.innerHTML = '<div class="dp-container"><h1>Результаты поиска: \u00ab' + esc(q) + '\u00bb</h1>'
      + '<p class="dp-results__status">Ищем\u2026</p><div class="dp-results__grid"></div>'
      + '<div class="dp-results__more"></div></div>';
    host.parentNode.insertBefore(wrap, host);
    var status = wrap.querySelector('.dp-results__status');
    var grid = wrap.querySelector('.dp-results__grid');
    var more = wrap.querySelector('.dp-results__more');

    fetch(IDX_URL).then(function(r){ return r.json(); }).then(function(data){
      var terms = norm(q).split(/[^\p{L}\p{N}]+/u).filter(Boolean);
      var hits = data.i.filter(function(it){
        var hay = norm(it[0] + ' ' + it[1]);
        for (var i = 0; i < terms.length; i++) if (hay.indexOf(terms[i]) === -1) return false;
        return true;
      });
      if (!hits.length) {
        status.textContent = 'Ничего не найдено по запросу \u00ab' + q + '\u00bb.';
        more.innerHTML = '<a class="dp-btn dp-btn-secondary" href="/catalog">Вернуться в каталог</a>';
        return;
      }
      status.textContent = 'Найдено товаров: ' + hits.length;
      var shown = 0;
      function render(){
        var part = hits.slice(shown, shown + PAGE);
        part.forEach(function(it){
          var img = it[4] ? (/^https?:/.test(it[4]) ? it[4] : data.p + it[4]) : '';
          var url = '/catalog/tproduct/' + it[3];
          var card = document.createElement('div');
          card.className = 'dp-scard';
          card.innerHTML =
            '<a class="dp-scard__imgwrap" href="' + url + '">' +
              (img ? '<img class="dp-scard__img" src="' + esc(img) + '" alt="' + esc(it[0]) + '" loading="lazy">'
                   : '<span class="dp-scard__noimg"></span>') +
            '</a>' +
            '<a class="dp-scard__name" href="' + url + '">' + esc(it[0]) + '</a>' +
            (it[1] ? '<div class="dp-scard__sku">Артикул: ' + esc(it[1]) + '</div>' : '') +
            '<div class="dp-scard__price">' + money(it[2]) + '</div>' +
            '<button type="button" class="dp-btn dp-btn-primary dp-scard__btn">В корзину</button>';
          card.querySelector('.dp-scard__btn').addEventListener('click', function(){
            if (typeof window.tcart__addProduct !== 'function') { location.href = url; return; }
            window.tcart__addProduct({ uid: it[3].split('-')[0], name: it[0], price: parseFloat(it[2]) || 0,
              quantity: 1, sku: it[1], img: img, url: location.origin + url });
          });
          grid.appendChild(card);
        });
        shown += part.length;
        more.innerHTML = '';
        if (shown < hits.length) {
          var b = document.createElement('button');
          b.type = 'button'; b.className = 'dp-btn dp-btn-secondary'; b.textContent = 'Показать ещё';
          b.addEventListener('click', render);
          more.appendChild(b);
        }
      }
      render();
    }).catch(function(){
      status.textContent = 'Не удалось загрузить поиск. Попробуйте выбрать раздел каталога.';
      host.style.display = '';
      wrap.querySelector('.dp-results__grid').remove();
    });
  }
})();
</script>
