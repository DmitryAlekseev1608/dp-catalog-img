<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;700&display=swap">
<style>
  .dp *, .dp-dialog * { box-sizing: border-box; }
  .dp { --acc:#ee5600; --acc-dark:#d94e00; --acc-shadow:rgba(234,44,0,.35); --muted:#eeeeee; --sec:#6f6f6f; --ter:#555555; --border:#e2e2e2; --r-sm:8px; --r-md:14px; --r-lg:24px; --shadow:0 4px 18px rgba(0,0,0,.06);
    font-family:"Comfortaa","Segoe UI",Arial,sans-serif; color:#000; background:#fff; line-height:1.5; }
  .dp a { color:inherit; text-decoration:none; }
  .dp h1,.dp h2,.dp h3 { font-weight:700; letter-spacing:-0.01em; }
  .dp h1 { font-size:34px; margin:0 0 16px; }
  .dp-container { width:100%; margin:0 auto; padding:0 40px; }

  /* --- Шапка --- */
  .dp-header { position:sticky; top:0; z-index:1000; background:rgba(255,255,255,.72); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); box-shadow:0 8px 30px -12px rgba(0,0,0,.15); border-radius:0 0 30px 30px; padding:16px 0; }
  .dp-header__inner { display:flex; align-items:center; gap:16px; }
  .dp-logo { flex:0 0 auto; display:flex; }
  .dp-logo img { width:46px; height:46px; border-radius:50%; }
  .dp-search { display:flex; align-items:center; flex:1 1 auto; min-width:0; background:var(--muted); border-radius:10px; overflow:hidden; }
  .dp-search input { flex:1 1 auto; min-width:0; border:none; background:transparent; padding:12px 0 12px 16px; font-family:inherit; font-size:15px; color:#000; }
  .dp-search input:focus { outline:none; }
  .dp-search button { flex:0 0 auto; display:flex; align-items:center; justify-content:center; width:44px; height:44px; border:none; background:transparent; color:var(--sec); cursor:pointer; }
  .dp-search button:hover { color:var(--acc); }
  .dp-search-toggle { display:none; align-items:center; justify-content:center; width:40px; height:40px; border:none; background:transparent; color:#000; cursor:pointer; flex:0 0 auto; padding:0; }
  .dp-catbtn { display:inline-flex; align-items:center; flex:0 0 auto; border:2px solid var(--acc); border-radius:999px; padding:8px 16px; font-weight:600; font-size:14px; color:var(--acc); white-space:nowrap; }
  .dp-catbtn:hover { background:var(--acc); color:#fff; }
  .dp-cart { display:inline-flex; align-items:center; gap:6px; flex:0 0 auto; background:var(--acc); color:#fff; border-radius:999px; padding:8px 16px; font-weight:600; font-size:14px; box-shadow:0 0 20px var(--acc-shadow); white-space:nowrap; cursor:pointer; }
  .dp-cart:hover { background:var(--acc-dark); color:#fff; }
  .dp-hamburger { display:inline-flex; flex-direction:column; justify-content:center; gap:5px; width:40px; height:40px; border:none; background:transparent; cursor:pointer; padding:0; flex:0 0 auto; }
  .dp-hamburger span { display:block; height:2px; width:22px; background:#000; border-radius:2px; }
  .dp-menu { display:none; flex-direction:column; gap:4px; width:100%; margin:0 auto; padding:0 40px 16px; }
  .dp-menu.is-open { display:flex; }
  .dp-menu a, .dp-menu .dp-linkbtn { padding:10px 0; border-top:1px solid var(--border); font-size:15px; }
  .dp-linkbtn { border:none; background:transparent; padding:0; font:inherit; color:inherit; cursor:pointer; text-align:left; }
  .dp-linkbtn:hover { color:var(--acc); }
  @media (min-width:721px) {
    .dp-hamburger { display:none; }
    .dp-menu { display:flex; flex-direction:row; align-items:center; gap:32px; padding:28px 40px 0; }
    .dp-menu a, .dp-menu .dp-linkbtn { padding:0; border-top:none; font-size:17px; font-weight:600; }
  }

  /* --- Кнопки --- */
  .dp-btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:6px; padding:12px 22px; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; }
  .dp-btn-primary { background:var(--acc); color:#fff; box-shadow:0 0 20px var(--acc-shadow); }
  .dp-btn-primary:hover { background:var(--acc-dark); color:#fff; }
  .dp-btn-secondary { background:var(--muted); color:#000; }
  .dp-btn-secondary:hover { background:#e2e2e2; }

  /* --- Диалог «Доставка и оплата» --- */
  .dp-dialog { border:none; border-radius:14px; box-shadow:0 4px 18px rgba(0,0,0,.06); padding:28px; max-width:420px; width:calc(100% - 40px); font-family:"Comfortaa","Segoe UI",Arial,sans-serif; color:#000; line-height:1.5; position:fixed; }
  .dp-dialog::backdrop { background:rgba(0,0,0,.4); }
  .dp-dialog h3 { margin-top:0; font-weight:700; }
  .dp-dialog__close { position:absolute; top:14px; right:14px; border:none; background:transparent; font-size:20px; line-height:1; cursor:pointer; color:#6f6f6f; }

  /* --- Подвал --- */
  .dp-footer { margin-top:64px; background:var(--acc); padding:32px 0; color:rgba(255,255,255,.85); font-size:17px; }
  .dp-footer a:hover, .dp-footer .dp-linkbtn:hover { color:#fff; }
  .dp-footer__grid { display:grid; grid-template-columns:repeat(3,1fr); gap:32px; overflow-wrap:break-word; }
  .dp-footer__col h4 { color:#fff; font-size:19px; margin:0 0 14px; font-weight:700; }
  .dp-footer__col ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .dp-footer .dp-linkbtn { color:rgba(255,255,255,.85); font-size:17px; }

  @media (max-width:720px) {
    .dp-container { padding:0 24px; }
    .dp h1 { font-size:26px; overflow-wrap:anywhere; }
    .dp-header__inner { flex-wrap:wrap; gap:8px; justify-content:space-between; }
    .dp-logo { order:1; }
    .dp-logo img { width:32px; height:32px; }
    .dp-search-toggle { display:inline-flex; order:2; }
    .dp-search { display:none; order:6; flex:1 1 100%; min-width:0; margin-top:10px; }
    .dp-search.is-open { display:flex; }
    .dp-search input { padding:8px 0 8px 10px; font-size:14px; }
    .dp-search button { width:36px; height:36px; }
    .dp-catbtn { order:3; padding:8px 12px; font-size:13px; }
    .dp-cart { order:4; padding:8px 10px; }
    .dp-cart__label { display:none; }
    .dp-hamburger { order:5; }
    .dp-menu { padding:0 24px 16px; }
    .dp-footer__grid { grid-template-columns:1fr 1fr; }
  }
  @media (max-width:480px) {
    .dp-footer__grid { grid-template-columns:1fr; }
  }

  /* --- Каталог Tilda (ST300) приводим к виду карточек Go-приложения --- */
  #rec3583252201, #rec3583253601 { padding:0 !important; }
  #rec3580539201 { padding-top:16px !important; padding-bottom:48px !important; }
  #rec3580539201, #rec3580539201 * { font-family:"Comfortaa","Segoe UI",Arial,sans-serif !important; }
  #rec3580539201 .t-container, #rec3580539201 .t-catalog__grid-cont { max-width:none !important; padding-left:40px !important; padding-right:40px !important; }

  #rec3580539201 .t-section__title { font-size:34px !important; font-weight:700 !important; letter-spacing:-0.01em; text-align:left !important; margin:0 0 8px !important; }
  #rec3580539201 .t-section__descr { font-size:17px !important; color:#6f6f6f !important; text-align:left !important; max-width:none !important; margin:0 0 24px !important; }

  /* Разделы каталога — «чипы», как .chip в Go-приложении */
  #rec3580539201 .t-catalog__parts-switch-btn { border-radius:999px !important; border:1px solid #e2e2e2 !important; background:#eeeeee !important; color:#000 !important; font-size:14px !important; font-weight:600 !important; padding:8px 16px !important; }
  #rec3580539201 .t-catalog__parts-switch-btn:hover { border-color:#ee5600 !important; color:#ee5600 !important; }
  #rec3580539201 .t-catalog__parts-current, #rec3580539201 .t-catalog__parts-switch-btn.t-active { background:#ee5600 !important; border-color:#ee5600 !important; color:#fff !important; }

  /* Карточка товара */
  #rec3580539201 .t-catalog__card { border:1px solid #e2e2e2; border-radius:14px; padding:16px; text-align:left !important; }
  #rec3580539201 .t-catalog__card__imgwrapper { border-radius:8px; overflow:hidden; }
  #rec3580539201 .t-catalog__card__bgimg { background-size:contain !important; background-color:#fff; }
  #rec3580539201 .t-catalog__card__title { font-size:15px !important; font-weight:700 !important; line-height:1.35 !important; text-align:left !important; margin-top:10px; }
  #rec3580539201 .t-catalog__card__sku { display:block !important; font-size:12px !important; color:#6f6f6f !important; opacity:1 !important; text-align:left !important; margin-top:6px; }
  #rec3580539201 .t-catalog__card__descr { font-size:13.2px !important; line-height:1.4 !important; color:#6f6f6f !important; opacity:1 !important; text-align:left !important; max-width:none !important; margin-top:8px;
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; }
  #rec3580539201 .t-catalog__card__price-wrapper { justify-content:flex-start !important; margin-top:10px; }
  #rec3580539201 .t-catalog__card__price, #rec3580539201 .t-catalog__card__price-value, #rec3580539201 .t-catalog__card__price-currency { color:#ee5600 !important; font-weight:700 !important; font-size:16px !important; }
  #rec3580539201 .t-catalog__card__prod-controls-wrapper { text-align:left !important; margin-top:12px; }
  #rec3580539201 .t-catalog__card .t-btn, #rec3580539201 .t-catalog__card .t-store__card__btn { background:#ee5600 !important; color:#fff !important; border:none !important; border-radius:6px !important; font-weight:600 !important; font-size:15px !important; width:100% !important; }
  #rec3580539201 .t-catalog__card .t-btn:hover { background:#d94e00 !important; }

  /* Товары без фотографии — вместо «рыбы» Tilda ставим приглушённый логотип */
  #rec3580539201 .dp-nophoto .t-catalog__card__bgimg {
    background-image:url(https://raw.githubusercontent.com/DmitryAlekseev1608/dp-catalog-img/main/logo-512.png) !important; background-size:45% !important;
    background-repeat:no-repeat !important; background-position:center !important;
    background-color:#eeeeee !important; opacity:.45; }

  /* Пагинация и «Загрузить ещё» */
  #rec3580539201 .t-catalog__pagination__item.t-active, #rec3580539201 .t-pagination__item.t-active { background:#ee5600 !important; color:#fff !important; border-color:#ee5600 !important; }

  @media (max-width:720px) {
    #rec3580539201 .t-container, #rec3580539201 .t-catalog__grid-cont { padding-left:24px !important; padding-right:24px !important; }
    #rec3580539201 .t-section__title { font-size:26px !important; }
  }
</style>
<div class="dp">
<header class="dp-header">
  <div class="dp-container dp-header__inner">
    <a class="dp-logo" href="/"><img src="https://raw.githubusercontent.com/DmitryAlekseev1608/dp-catalog-img/main/logo-512.png" alt="Зубной партнёр"></a>
    <button type="button" class="dp-search-toggle js-dp-search-toggle" aria-label="Поиск"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></button>
    <form class="dp-search js-dp-search" method="get" action="/catalog">
      <input type="search" name="q" placeholder="Поиск по каталогу" aria-label="Поиск по каталогу">
      <button type="submit" aria-label="Найти"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></button>
    </form>
    <a class="dp-catbtn" href="/catalog">Каталог</a>
    <a class="dp-cart" href="#opencart" aria-label="Корзина"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg><span class="dp-cart__label">Корзина</span></a>
    <button type="button" class="dp-hamburger js-dp-hamburger" aria-label="Открыть меню" aria-expanded="false"><span></span><span></span><span></span></button>
  </div>
  <nav class="dp-menu js-dp-menu">
    <a href="/#about">О нас</a>
    <a href="/contacts">Контакты</a>
    <button type="button" class="dp-linkbtn js-dp-delivery">Доставка и оплата</button>
    <a href="/contacts#form">Оставить заявку</a>
    <a href="/account">Личный кабинет</a>
  </nav>
</header>
</div>
<script>
(function(){
  if (window.__dpShell) return; window.__dpShell = 1;
  document.addEventListener('click', function(e){
    var t = e.target.closest('.js-dp-search-toggle');
    if (t) { var f = document.querySelector('.js-dp-search'); if (f) f.classList.toggle('is-open'); return; }
    var h = e.target.closest('.js-dp-hamburger');
    if (h) { var m = document.querySelector('.js-dp-menu'); if (m) { m.classList.toggle('is-open');
      h.setAttribute('aria-expanded', m.classList.contains('is-open') ? 'true' : 'false'); } return; }
    var d = e.target.closest('.js-dp-delivery');
    if (d) { var dlg = document.getElementById('dp-dlg-delivery');
      if (dlg && dlg.showModal) dlg.showModal(); e.preventDefault(); return; }
    var c = e.target.closest('.js-dp-dlg-close');
    if (c) { var dl = c.closest('dialog'); if (dl) dl.close(); return; }
  });
  // Поиск из шапки: на /catalog отдаём запрос встроенному поиску Tilda,
  // на остальных страницах — переход на /catalog?q=...
  var form = document.querySelector('.js-dp-search');
  if (form) form.addEventListener('submit', function(e){
    var q = (form.querySelector('input[name=q]') || {}).value || '';
    if (location.pathname.replace(/\/$/,'') === '/catalog') {
      e.preventDefault();
      if (dpApplyStoreSearch(q)) return;
      location.href = '/catalog?q=' + encodeURIComponent(q);
    }
  });
  function dpApplyStoreSearch(q){
    var inp = document.querySelector('.t-store__search-input, .t-catalog__search-input, input[name="tsearch"]');
    if (!inp) return false;
    inp.value = q;
    inp.dispatchEvent(new Event('input', {bubbles:true}));
    inp.dispatchEvent(new Event('change', {bubbles:true}));
    var f = inp.closest('form'); if (f) { try { f.requestSubmit ? f.requestSubmit() : f.submit(); } catch(_){} }
    inp.dispatchEvent(new KeyboardEvent('keyup', {bubbles:true, key:'Enter', keyCode:13}));
    return true;
  }
  // Подхватываем ?q= из адреса на странице каталога
  var m = location.search.match(/[?&]q=([^&]*)/);
  if (m && location.pathname.replace(/\/$/,'') === '/catalog') {
    var q = decodeURIComponent(m[1].replace(/\+/g,' '));
    var box = document.querySelector('.js-dp-search input[name=q]'); if (box) box.value = q;
    var tries = 0;
    var t = setInterval(function(){ if (dpApplyStoreSearch(q) || ++tries > 40) clearInterval(t); }, 400);
  }
})();
</script>
<script>
(function(){
  function mark(){
    document.querySelectorAll('.js-product').forEach(function(c){
      var img = c.getAttribute('data-product-img');
      if (!img) c.classList.add('dp-nophoto'); else c.classList.remove('dp-nophoto');
    });
  }
  mark();
  var mo = new MutationObserver(function(){ mark(); });
  mo.observe(document.documentElement, {childList:true, subtree:true});
  setInterval(mark, 1500);
})();
</script>
